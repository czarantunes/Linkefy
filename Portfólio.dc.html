<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<link rel="icon" type="image/png" href="assets/star-sm.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:#0D0D0D}
  a{color:#F7941D;text-decoration:none}
  ::selection{background:#E8720C;color:#0D0D0D}
</style>
</helmet>
<div data-lk-root style="font-family:'Manrope',system-ui,sans-serif;background:#0D0D0D;color:#fff;min-height:100vh;overflow-x:hidden">

  <header style="position:sticky;top:0;z-index:50;background:rgba(13,13,13,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)">
    <div style="max-width:1200px;margin:0 auto;padding:14px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px">
      <a href="Linkefy Landing.dc.html" style="display:flex;align-items:center">
        <img src="assets/logo-white.png" alt="Linkefy" style="height:clamp(26px,3vw,34px);width:auto;display:block">
      </a>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px">
        <div style="display:flex;align-items:center;gap:7px"><button type="button" onClick="{{ setPt }}" data-lk-flag="pt" aria-label="Português" style="padding:2px;border:2px solid #F7941D;border-radius:50%;background:none;cursor:pointer;line-height:0;display:inline-flex;opacity:1;overflow:hidden"><span style="display:block;width:22px;height:22px;border-radius:50%;overflow:hidden;line-height:0"><svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" fill="#009B3A"/><path d="M12 3 22 12 12 21 2 12Z" fill="#FEDF00"/><circle cx="12" cy="12" r="4.1" fill="#002776"/></svg></span></button><button type="button" onClick="{{ setEn }}" data-lk-flag="en" aria-label="English" style="padding:2px;border:2px solid transparent;border-radius:50%;background:none;cursor:pointer;line-height:0;display:inline-flex;opacity:.45;overflow:hidden"><span style="display:block;width:22px;height:22px;border-radius:50%;overflow:hidden;line-height:0"><svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" fill="#fff"/><g fill="#B22234"><rect width="24" height="3.4"/><rect y="6.8" width="24" height="3.4"/><rect y="13.6" width="24" height="3.4"/><rect y="20.4" width="24" height="3.4"/></g><rect width="11" height="10.2" fill="#3C3B6E"/></svg></span></button><button type="button" onClick="{{ setEs }}" data-lk-flag="es" aria-label="Español" style="padding:2px;border:2px solid transparent;border-radius:50%;background:none;cursor:pointer;line-height:0;display:inline-flex;opacity:.45;overflow:hidden"><span style="display:block;width:22px;height:22px;border-radius:50%;overflow:hidden;line-height:0"><svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" fill="#AA151B"/><rect y="6" width="24" height="12" fill="#F1BF00"/></svg></span></button></div>
        <a href="Linkefy Landing.dc.html" style="color:#d6d6d6;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:7px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d6d6d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          Início
        </a>
        <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
          <a href="{{ waLink }}" target="_blank" style="display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#F7941D,#E8720C);color:#0D0D0D;font-family:'Sora';font-weight:700;font-size:14px;padding:11px 20px;border-radius:10px;min-height:44px;box-shadow:0 6px 22px rgba(232,114,12,.35)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-11.6 7.73L3 21l1.9-6.3A8.5 8.5 0 1 1 21 11.5Z"/></svg>
            Fale com a gente
          </a>
        </sc-if>
      </div>
    </div>
  </header>

  <main style="position:relative;max-width:620px;margin:0 auto;padding:clamp(40px,6vw,68px) 22px clamp(56px,7vw,88px)">
    <div style="position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:min(820px,160%);height:520px;background:radial-gradient(circle at 50% 30%,rgba(232,114,12,.28),rgba(232,114,12,.08) 42%,transparent 68%);pointer-events:none"></div>

    <div style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px">
      <span style="width:clamp(84px,18vw,104px);height:clamp(84px,18vw,104px);border-radius:26px;background:#141414;border:1px solid rgba(232,114,12,.35);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 46px rgba(232,114,12,.22)">
        <img src="assets/star-sm.png" alt="Linkefy" style="width:56%;height:auto;display:block">
      </span>
      <h1 style="font-family:'Sora';font-weight:800;font-size:clamp(26px,4.6vw,38px);letter-spacing:-.02em;line-height:1.08;margin-top:4px">Projetos que já estão no ar</h1>
      <p style="color:#b9b9b9;font-size:clamp(15px,2.2vw,17px);line-height:1.55;max-width:440px">Toque em um projeto para visitar o site.</p>
    </div>

    <div style="position:relative;display:flex;flex-direction:column;gap:clamp(14px,2.4vw,18px);margin-top:clamp(30px,4.5vw,44px)">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
        <a href="{{ p.url }}" target="_blank" style="display:block;position:relative;background:#141414;border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;color:#fff;transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease" style-hover="border-color:rgba(247,148,29,.6);transform:translateY(-4px);box-shadow:0 22px 54px rgba(232,114,12,.22)">
          <div style="position:relative;aspect-ratio:1750/908;background:#0e0e0e">
            <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}">
              <div style="{{ p.coverStyle }}"></div>
            </sc-if>
            <sc-if value="{{ p.empty }}" hint-placeholder-val="{{ true }}">
              <image-slot id="{{ p.slot }}" shape="rect" placeholder="Arraste a capa do projeto" style="position:absolute;inset:0"></image-slot>
            </sc-if>
            <div style="position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(180deg,transparent,rgba(10,10,10,.9));pointer-events:none"></div>
            <div style="position:absolute;inset:auto 0 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:clamp(14px,2.6vw,20px)">
              <div style="min-width:0;text-align:left">
                <h3 style="font-family:'Sora';font-weight:700;font-size:clamp(15px,2.6vw,19px);line-height:1.2">{{ p.title }}</h3>
                <p style="color:#c0c0c0;font-size:clamp(12px,1.9vw,13px);margin-top:4px">{{ p.tag }}</p>
              </div>
              <span style="flex:0 0 auto;width:clamp(38px,6vw,44px);height:clamp(38px,6vw,44px);border-radius:12px;background:linear-gradient(180deg,#F7941D,#E8720C);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(232,114,12,.4)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
              </span>
            </div>
          </div>
        </a>
      </sc-for>

      <a href="{{ waLink }}" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:11px;background:linear-gradient(180deg,#F7941D,#E8720C);color:#0D0D0D;font-family:'Sora';font-weight:700;font-size:clamp(15px,2.4vw,17px);padding:18px 24px;border-radius:16px;min-height:56px;box-shadow:0 14px 38px rgba(232,114,12,.34);margin-top:6px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-11.6 7.73L3 21l1.9-6.3A8.5 8.5 0 1 1 21 11.5Z"/><path d="M9 8.6c.2-.5.5-.5.8-.5.3 0 .5.4.7.9.2.5.4 1.1.4 1.2 0 .2-.3.6-.5.8-.1.1-.1.3 0 .5.4.7 1.1 1.3 1.9 1.7.2.1.4.1.5 0l.6-.7c.1-.2.4-.2.6-.1l1.3.7c.2.1.3.2.3.4 0 .5-.4 1.1-1 1.3-.5.2-1.9.1-3.4-1.2-1.3-1.1-2-2.5-2.2-3.1-.1-.5-.1-1.3.1-1.9Z"/></svg>
        Quero um site assim
      </a>

      <a href="https://www.instagram.com/linkefy_/" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:'Sora';font-weight:600;font-size:clamp(15px,2.4vw,17px);padding:18px 24px;border-radius:16px;min-height:56px" style-hover="border-color:rgba(247,148,29,.5);background:rgba(255,255,255,.08)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7941D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
        Instagram
      </a>
    </div>
  </main>

  <footer style="border-top:1px solid rgba(255,255,255,.08);background:#0a0a0a">
    <div style="max-width:1200px;margin:0 auto;padding:clamp(30px,4vw,44px) 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px">
      <img src="assets/logo-white.png" alt="Linkefy" style="height:30px;width:auto;display:block">
      <span style="color:#6f6f6f;font-size:13px">© 2026 Linkefy — Florianópolis, SC</span>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5548 98800-0996&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;}}">
class Component extends DCLogic {
  state = { lang: (function(){ try { return localStorage.getItem('linkefy_lang') || 'pt'; } catch(e){ return 'pt'; } })(), narrow: (typeof window !== 'undefined' && window.innerWidth <= 700) };
  DICT = {"Início":{"en":"Home","es":"Inicio"},"Fale com a gente":{"en":"Get in touch","es":"Habla con nosotros"},"Portfólio":{"en":"Portfolio","es":"Portafolio"},"Projetos que já estão no ar":{"en":"Projects already live","es":"Proyectos que ya están en línea"},"Toque em um projeto para visitar o site.":{"en":"Tap a project to visit the site.","es":"Toca un proyecto para visitar el sitio."},"Quero um site assim":{"en":"I want a site like this","es":"Quiero un sitio así"},"Instagram":{"en":"Instagram","es":"Instagram"},"Site institucional":{"en":"Institutional website","es":"Sitio institucional"},"Landing page":{"en":"Landing page","es":"Landing page"},"Projeto 01":{"en":"Project 01","es":"Proyecto 01"},"Projeto 02":{"en":"Project 02","es":"Proyecto 02"},"Projeto 03":{"en":"Project 03","es":"Proyecto 03"}};

  componentDidMount() {
    this._onResize = () => { const n = window.innerWidth <= 700; if (n !== this.state.narrow) this.setState({ narrow: n }); };
    window.addEventListener('resize', this._onResize);
    setTimeout(() => this._apply(), 60);
  }
  componentWillUnmount() { if (this._onResize) window.removeEventListener('resize', this._onResize); }
  componentDidUpdate() { this._apply(); }

  _apply() {
    const root = document.querySelector('[data-lk-root]');
    if (!root) return;
    if (!this._map) this._map = new WeakMap();
    if (!this._rev) { this._rev = {}; for (const pt in this.DICT) { this._rev[pt]=pt; const e=this.DICT[pt]; if(e.en) this._rev[e.en]=pt; if(e.es) this._rev[e.es]=pt; } }
    const lang = this.state.lang;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = w.nextNode())) {
      let rec = this._map.get(n);
      if (!rec) {
        const raw = n.nodeValue; const t = raw.trim();
        const key = this._rev[t];
        if (!t || !key) continue;
        rec = { key: key, lead: raw.slice(0, raw.indexOf(t)), trail: raw.slice(raw.indexOf(t) + t.length) };
        this._map.set(n, rec);
      }
      const e = this.DICT[rec.key];
      const val = (lang === 'pt') ? rec.key : (e[lang] || rec.key);
      n.nodeValue = rec.lead + val + rec.trail;
    }
    ['pt','en','es'].forEach(l => { root.querySelectorAll('[data-lk-flag="'+l+'"]').forEach(b => { b.style.opacity=(l===lang)?'1':'.45'; b.style.borderColor=(l===lang)?'#F7941D':'transparent'; }); });
    try { document.documentElement.lang = lang==='pt'?'pt-BR':(lang==='en'?'en':'es'); } catch(e){}
  }

  _setLang(lang) { try { localStorage.setItem('linkefy_lang', lang); } catch(e){} this.setState({ lang }); }

  renderVals() {
    const digits = String(this.props.whatsappNumber ?? '5548988000996').replace(/\D/g, '');
    const msgs = { pt:'Olá! Vim pelo site da Linkefy e quero solicitar um orçamento.', en:'Hi! I came from the Linkefy website and would like to request a quote.', es:'¡Hola! Vine desde el sitio de Linkefy y quiero solicitar un presupuesto.' };
    const msg = encodeURIComponent(msgs[this.state.lang] || msgs.pt);
    const projects = (this.props.projects ?? [
      { title: 'Loa Select', tag: 'Site institucional', url: 'https://www.loaselect.com.br/', slot: 'proj-1', img: 'assets/proj-loa-select.jpg' },
      { title: 'Catafesta Art Culinária', tag: 'Site e Menu Digital', url: 'https://linkefy.github.io/CatafestaArtCulin-ria/', slot: 'proj-2', img: 'assets/proj-catafesta.jpg' },
      { title: 'Plenah Clinic', tag: 'Site institucional', url: 'https://linkefy.github.io/PlenahClinic/', slot: 'proj-3', img: 'assets/proj-plenah.jpg' },
    ]).map(p => ({
      ...p,
      empty: !p.img,
      coverStyle: p.img ? { position:'absolute', inset:0, backgroundImage:`url("${p.img}")`, backgroundSize:'contain', backgroundPosition:'center', backgroundRepeat:'no-repeat' } : null,
    }));
    return {
      projects,
      showCta: !this.state.narrow,
      waLink: `https://wa.me/${digits}?text=${msg}`,
      setPt: () => this._setLang('pt'),
      setEn: () => this._setLang('en'),
      setEs: () => this._setLang('es'),
    };
  }
}
</script>
</body>
</html>
