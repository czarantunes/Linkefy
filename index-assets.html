  return '<footer style="background:#f5f5f7;margin-top:clamp(56px,8vw,100px);border-top:1px solid rgba(0,0,0,.06)"><div style="max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,72px) 22px;text-align:center">'
    +'<img src="'+img("asterisk.png")+'" alt="" aria-hidden="true" style="width:42px;height:42px;margin:0 auto 18px">'
    +'<h2 style="font-size:clamp(24px,3vw,34px);font-weight:600;margin:0 0 6px">LOA<span style="color:#0a90dd">*</span> Select</h2>'
    +'<p style="font-size:14px;color:#86868b;margin:0 0 26px">Curadoria de produtos Apple · 🇧🇷 Envio para todo o Brasil</p>'
    +'<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center"><a href="'+waGeneral+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:9px;background:#0a90dd;color:#fff;font-size:15px;font-weight:600;padding:13px 24px;border-radius:980px;box-shadow:0 8px 22px rgba(10,144,221,.3)">'+WAICON+' WhatsApp</a>'
    +'<a href="'+INSTA+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:9px;background:#fff;color:#1d1d1f;font-size:15px;font-weight:500;padding:13px 22px;border-radius:980px;border:1px solid rgba(0,0,0,.12)">'+IGICON+' @loa.select</a></div>'
    +'<p style="font-size:11px;line-height:1.7;color:#86868b;max-width:560px;margin:34px auto 0">LOA<span style="color:#0a90dd">*</span> Select é uma revendedora independente. Apple, iPhone, MacBook, iPad, AirPods e Apple Watch são marcas registradas da Apple Inc.</p></div></footer>';
}

function floatWa(){return '<a href="'+waGeneral+'" target="_blank" rel="noopener" aria-label="Fale conosco no WhatsApp" class="wa-float" style="position:fixed;right:22px;bottom:22px;z-index:80;width:60px;height:60px;border-radius:50%;background:#0a90dd;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(10,144,221,.42);animation:waBob 2.4s ease-in-out infinite,waPulse 2.4s ease-out infinite">'+WAICON.replace('width="20" height="20"','width="32" height="32"')+'</a>';}

function render(){
  var h=location.hash.replace(/^#/,"");
  var isDetail=h.indexOf("p/")===0;
  var app=document.getElementById("app");
  app.className=isDetail?"is-detail":"";
  if(isDetail){
    var p=BY[h.slice(2)]||PRODUCTS[0];
    app.innerHTML=header()+detail(p)+footer()+floatWa();
    document.title=p.name+" — LOA* Select";
    window.scrollTo(0,0);
  }else{
    app.innerHTML=header()+home()+footer()+floatWa();
    document.title="LOA* Select — Produtos Apple";
  }
}
function openProduct(id){menuOpen=false;location.hash="p/"+id;}
function goHome(){menuOpen=false;if(location.hash)location.hash="";else render();}
function goCat(id){menuOpen=false;if(location.hash){pendingCat=id;location.hash="";}else scrollCat(id);}
function navCat(id){menuOpen=false;goCat(id);}
function toggleMenu(){menuOpen=!menuOpen;render();}
function setImg(i){curGi=i;var m=document.getElementById("mainImg");if(m)m.src=img(curP.gallery[i]);curP.gallery.forEach(function(g,j){var t=document.getElementById("th"+j);if(t)t.style.borderColor=(j===i?"#0a90dd":"transparent");});}
function scrollRow(id,dir){var el=document.getElementById(id);if(el)el.scrollBy({left:dir*Math.max(300,el.clientWidth*0.85),behavior:"smooth"});}
function scrollCat(id){var el=document.getElementById(id);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-100,behavior:"smooth"});}
var pendingCat=null;
if("scrollRestoration" in history)history.scrollRestoration="manual";
window.addEventListener("hashchange",function(){render();if(pendingCat){var id=pendingCat;pendingCat=null;setTimeout(function(){scrollCat(id);},60);}});
render();
</script>
</body>
</html>
